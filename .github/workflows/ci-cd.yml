name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  buildAndDeployPreview:
    name: Build Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to cloudflare
        id: deployPreview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env preview

  CreatePreviewRelease:
    name: Create Preview Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: buildAndDeployPreview
    steps:
      - name: Checkout code for release creation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release version
        id: generate_version
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "version=preview-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.generate_version.outputs.version }}
          release_name: "Preview Release ${{ steps.generate_version.outputs.version }}"
          body: |
            ### Preview Environment Deployment
            **Deployed at:** ${{ steps.generate_version.outputs.date }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}

            This is an automated preview release deployed to the preview environment.
          draft: false
          prerelease: false

