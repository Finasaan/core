name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: write

jobs:
  buildAndTest:
    name: Build Core
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.open-next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build:cf

  buildAndDeployPreview:
    name: Build Core
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    outputs:
      deployment-url: ${{ steps.deployPreview.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.open-next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build:cf

      - name: Deploy to cloudflare
        id: deployPreview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env preview

      - name: print deployment-url
        env:
          DEPLOYMENT_URL: ${{ steps.deployPreview.outputs.deployment-url }}
        run: echo $DEPLOYMENT_URL

  CreatePreviewRelease:
    name: Create Preview Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: buildAndDeployPreview
    steps:
      - name: Checkout code for release creation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release version
        id: generate_version
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "version=preview-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "${{ steps.generate_version.outputs.version }}"
          tag_name: ${{ steps.generate_version.outputs.version }}
          body: |
            ### Preview Environment Deployment
            **Deployed at:** ${{ steps.generate_version.outputs.date }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Deployment URL:** ${{ needs.buildAndDeployPreview.outputs.deployment-url }}

            This is an automated preview release deployed to the preview environment.
          draft: false
          prerelease: false
          make_latest: false

